services:
  db:
    image: mysql:8
    container_name: golf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: golf_club
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--password=${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
